<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#2fd1c3"> <!-- Android Chrome用 -->
	<meta name="apple-mobile-web-app-status-bar-style" content="#2fd1c3"> <!-- iOS Safari用 -->

<style>
    :root{
        --base-size: min( 1vw, 1vh);
        --ivory: #f8f4e6;
        --ivory-edge: #33342d;
        --ivory-thin: #d1d3c9;
        --hand-color-light: #0a2961;
        --hand-color-dark: #00163e;
        --gray_color: #161616;
        --white_color: #c4c4c4;
        
        --pre_deg1: 0%;
        --pre_deg2: 0%;
        --pre_deg3: 0%;
        --pre_deg4: 0%;
        --pre_deg5: 0%;
        --pre_deg6: 0%;
        --pre_deg7: 0%;
    }

    #bodyId{
        transition: background-color 0.4s ease;
        background-color: #060337;
    }

    .main-items{
        display: flex;
        position: relative;
        flex-direction: column;
        margin: auto;
        width: 100%;
        height: 100%;
        align-items: center;
    }

    .analog-clock-wrapper{
        display: flex;
        position: relative;
        margin-top: 3%;
        justify-content: center;
        align-items: center;
        width:  calc(var(--base-size)*70);
        height: calc(var(--base-size)*70);
    }

    .dial{
        position: absolute;
        background-color: var(--ivory);
        border-radius: 50%;
    }

    .base{
        inset: 0;
        border: calc(var(--base-size)*1) solid var(--ivory-edge);
    }
    .dots-back{
        background-color: var(--ivory-thin);
        inset: 2%;
    }

    #alarm-disk{
        transform-origin: center;
        position: absolute;
        width:  100%;
        height: 100%;
        top:  50%;
        left: 50%;
        transform: translate(-50%,-50%);
        border-radius: 50%;
        /* z-index: 3; */
        background-image: conic-gradient(#ffffff00 0% var(--pre_deg1), 
                                        #f1001880 var(--pre_deg1) var(--pre_deg2),
                                        #0004ff95 var(--pre_deg2) var(--pre_deg3), 
                                        #00000000 var(--pre_deg3) 100%);
        transition: background-image 0.2s ease-in-out;
    }

    .outside-dot{
        background-color: #00000000;
        inset: 2%;
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
    }
    .inside-dot{
        inset: 4%;
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
    }
    .dial-text-circle-outside{
        inset: 6%;
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
        background-color: var(--ivory-thin);
    }
    .dial-text-circle-inside{
        inset: 14%;
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
    }
    .dots{
        position: absolute;
        inset: 2%;
        background-color: var(--ivory-edge);
    }
    .hour-hands-dots{
        position: absolute;
        inset: 6%;
    }
    .sec-dots{
        position: absolute;
        /* inset: 0; */
        background-color: var(--ivory-edge);
    }

    .center-circle{
        background-color: #636363;
        border-radius: 50%;
    }
    .dial-text{
        position: absolute;
        height: 60.5%;
        color: var(--ivory-edge);
        font-size: min( 4vw, 4vh );
        font-family: serif,sans-serif;
        font-weight: 800;
        transform: scale(1,1.5);
    }
    #date{
        position: absolute;
        width: calc( var(--base-size)*6 );
        top: 35%;
        left: 33%;
        color: var(--ivory-edge);
        text-align: center;
        font-size: min( 3vw, 3vh );
        font-family: Copperplate Gothic, serif;
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
        border-radius: 10%;
    }
    .day-of-week-wrapper{
        display: flex;
        position: absolute;
        width:  45%;
        height: 45%;
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
        border-radius: 50%;
        left: 18%;
        justify-content: center;
        align-items: center;
    }
    .day-of-week{
        position: absolute;
        height: 95%;
        font-size: min( 2vw, 2vh );
        font-family: Copperplate Gothic, serif;
        font-weight: 800;
    }
    .monday{
        rotate: 225deg;
    }
    .tuesday{
        rotate: 240deg;
    }
    .wednesday{
        rotate: 255deg;
    }
    .thursday{
        rotate: 270deg;
    }
    .friday{
        rotate: 285deg;
    }
    .saturday{
        rotate: 300deg;
    }
    .sunday{
        rotate: 315deg;
    }
    #week-hand{
        height: 80%;
        width: 3%;
        background-color: var(--hand-color-dark);
        clip-path: polygon(41% 0%, 59% 0%, 100% 40%, 55% 50%, 45% 50%,  0% 40%);
    }
    .center-week-dial{
        position: absolute;
        width:  3%;
        height: 3%;
        border: calc(var(--base-size)*0.6) solid var(--hand-color-light);
    }

    .num-12{
        margin-bottom: 0%;
    }
    .num-3{
        rotate: 90deg;
    }
    .num-6{
        rotate: 180deg;
    }
    .num-9{
        rotate: 270deg;
    }
    /* ------------------------------------------------------------------------------------- */
    .sec-wrapper{
        display: flex;
        position: absolute;
        justify-content: center;
        align-items: center;
        width: calc( var(--base-size)*23);
        height: calc( var(--base-size)*23);
        margin-top: 55%;
    }
    .small-sec-dial{
        position: absolute;
        inset: 0;
        background-color: var(--ivory-thin);
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
    }
    .small-sec-inside-dial{
        position: absolute;
        inset: 10%;
        background-color: var(--ivory-thin);
        border: calc(var(--base-size)*0.2) solid var(--ivory-edge);
    }
    .sec-hand{
        position: absolute;
        width: 2%;
        height: 90%;
        background-color: var(--hand-color-light);
        clip-path: polygon(40% 0%, 60% 0%, 100% 65%, 0% 65%);
    }
    .center-sec-dial{
        position: absolute;
        width: 1%;
        height: 1%;
        border: calc(var(--base-size)*0.6) solid var(--hand-color-light);
    }
    /* ------------------------------------------------------------------------------------- */
    .hour-hands{
        display: flex;
        position: absolute;
        justify-content: center;
        align-items: center;
        width: 4.5%;
        height: 73%;
    }
    .hour-arm{
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: var(--hand-color-dark);
        clip-path: polygon(40% 23%, 60% 23%,
                            65% 50%, 35% 50%);
    }
    .hour-arm-circle{
        position: absolute;
        width: calc( var(--base-size)*5);
        height: calc( var(--base-size)*5);
        background-color: var(--hand-color-dark);
        border-radius: 50%;
        top: 15%;
        mask:         radial-gradient(circle at , transparent 40%, var(--ivory-edge) 40%); /* 円形に, 内側の色と境界，外側の色と境界*/
        -webkit-mask: radial-gradient(circle at 50% 40%, transparent 34%, var(--ivory-edge) 35%);
    }
    .hour-tip{
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: var(--hand-color-dark);
        clip-path: polygon(48% 0%, 52% 0%,
                            67% 16%, 33% 16%);
    }
    /* ------------------------------------------------------------------------------------- */
    .min-hands{
        display: flex;
        position: absolute;
        justify-content: center;
        align-items: center;
        width: 4.5%;
        height: 91%;
        /* rotate: 6deg; */
    }
    .min-arm{
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: var(--hand-color-light);
        clip-path: polygon(40% 13%, 60% 13%,
                            65% 50%, 35% 50%);
    }
    .min-arm-circle{
        position: absolute;
        width: calc( var(--base-size)*3.5);
        height: calc( var(--base-size)*3.5);
        background-color: var(--hand-color-light);
        border-radius: 50%;
        top: 9%;
        mask:         radial-gradient(circle at , transparent 40%, var(--ivory-edge) 40%); /* 円形に, 内側の色と境界，外側の色と境界*/
        -webkit-mask: radial-gradient(circle at 50% 40%, transparent 34%, var(--ivory-edge) 35%);
    }
    .min-tip{
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: var(--hand-color-light);
        clip-path: polygon(47% 0%, 53% 0%,
                            67% 9.5%, 33% 9.5%);
    }
    /* ------------------------------------------------------------------------------------- */
    .center-hour-circle{
        position: absolute;
        width: 3%;
        height: 3%;
        border: calc(var(--base-size)*1) solid var(--hand-color-light);
    }

    /* ===================================================================================== */

    .digital-clock{
        padding-top: 20px;
        color: var(--ivory);
        font-family: serif;
    }

    /* ===================================================================================== */

    .menu-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* メニューボタンのスタイル */
    .menu-button {
        display: block;
        position: fixed;
        top: 50px;
        left: 40px;
        cursor: pointer;
        z-index: 2;
    }

    /* メニューバーのスタイル */
    .bar {
        display: block;
        position: relative;
        width: 25px;
        height: 3px;
        margin: 6px 0;
        background-color: var(--white_color);
        transition: 0.5s;
    }

    .bar:nth-child(2) {
        transition: 0s;
    }

    /* menu-toggle event */
    #menu-toggle:checked ~ .menu {
        left: 0%;
    }
    #menu-toggle:checked ~ .menu-title {
        left: 180px;
    }
    #menu-toggle:checked ~ .menu-container {
        left: 0%;
    }

    #menu-toggle:checked ~ .menu-button .bar:nth-child(1) {
        background-color: var(--gray_color);
        transform: translate(-12.5px, 0) scaleX(0%);
    }
    #menu-toggle:checked ~ .menu-button .bar:nth-child(2) {
        background-color: var(--gray_color);
        transform: scaleY(8.333);
        clip-path: polygon( 0% 0%, 10% 0%, 50% 40%, 90% 0%,
                            100% 0%, 100% 10%, 60% 50%, 100% 90%,
                            100% 100%, 90% 100%, 50% 60%, 10% 100%,
                            0% 100%, 0% 90%, 40% 50%, 0% 10%);
        transition: 0.5s;
    }
    #menu-toggle:checked ~ .menu-button .bar:nth-child(3) {
        background-color: var(--gray_color);
        transform: translate(12.5px, 0) scaleX(0%);
    }

    /* メニュートグルのスタイル */
    #menu-toggle {
        display: none;
    }

    /* メニューのスタイル */
    .menu {
        position: relative;
        display: flex;
        justify-content: center;
        /* align-items: center; */
        top: 0;
        left: -100%;
        width: 30%;
        height: 100%;
        background-color: #f3f3f3c1;
        border: 4px solid #7a7a7ac1;
        transition: 0.9s;
        z-index: 2;
        overflow-y: auto;
    }

    #menu-toggle:checked ~ .menu {
        left: 0;
        transition: 0.4s;
    }

    .buttons-wrapper {
        position: absolute;
        display: flex;
        flex-direction: column;
        margin: 20px;
        padding-top: 90px;
    }

    /* アラーム音有効化ボタン ----------------------------*/
    .button {
        position: relative;
        width: 200px;
        height: 60px;
        text-align: center;
        font-size: 18px;
        margin-bottom: 10px;
        margin-top: 10px;
        transition: 0.4s;
        font-family: serif;
        
    }
    .button:hover{
        background-color: #5a5a5a;
    }
    #enableAlarmButton{
        color: var(--ivory);
        background-color: #060337;
    }
    #enableAlarmButton:hover{
        color: #060337;
        background-color: var(--ivory);
    }
    #AlarmButton{
        color: var(--ivory);
        background-color: var(--hand-color-light);
    }
    #AlarmButton:hover{
        color: var(--hand-color-light);
        background-color: var(--ivory);
    }

    
    </style>

</head>

    <!-- Google Analytics (gtag.js) -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag("js", new Date());

        function displayTime(){
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            document.getElementById('digital-clock').textContent = timeString;
        }
        displayTime();
        setInterval(displayTime, 1000);

        function setDots(){
            // set dots
            const dialBase = document.getElementById('dots');
            const hourDial = document.getElementById('hour-hands-dots');
            const secDial = document.getElementById('sec-dots');
            for(let i=0; i<=14; i++){
                let newDot = document.createElement('div');
                let hourDot = document.createElement('div');
                let secDot = document.createElement('div');
                // main dials dots
                if(i%5 === 0){
                    newDot.classList.add('dots','hour-dots');
                }
                else{
                    newDot.classList.add('dots','min-dots');
                }

                // hour-dots
                if(i!==0 && i%5===0){
                    hourDot.classList.add('dots','hour-hands-dots');
                }

                // small seconds dots
                if(i===0){
                    secDot.classList.add('sec-dots','sec-3x-hour-dots');
                    secDot.style.inset = '0%';
                }
                else if(i%5===0){
                    secDot.classList.add('sec-dots','sec-hour-dots');
                    secDot.style.inset = '4%';
                }
                else{
                    secDot.classList.add('sec-dots','sec-min-dots');
                    secDot.style.inset = '7%';
                }

                newDot.style.transform = `rotate(${i * 6}deg)`;
                hourDot.style.transform = `rotate(${i * 6}deg)`;
                secDot.style.transform = `rotate(${i * 6}deg)`;
                dialBase.appendChild(newDot);
                secDial.appendChild(secDot);
                hourDial.appendChild(hourDot)
            }
        }

        function updateclock() {
            // move clocks hands
            const now = new Date();
                const h = now.getHours();
                const m = now.getMinutes();
                const seconds = now.getTime() / 1000;
                    const s = Math.floor(seconds * 10) / 10;
                    const s_set = now.getSeconds();
                const date = now.getDate();
                const dayOfWeek = now.getDay();
            
            const HourDeg = h * 30 + m * 0.5 + s_set * 0.00833333333;
            const MinDeg = m * 6 + s_set * 0.1;
            const SecDeg = s * 6;

            if(dayOfWeek===0) {
                var dayDeg = 315;
            }
            else {
                var dayDeg = 225 + 15*(dayOfWeek-1);
            }

            document.getElementById("hour-hands").style.transform = `rotate(${HourDeg}deg)`;
            document.getElementById("min-hands").style.transform = `rotate(${MinDeg}deg)`;
            document.getElementById("sec-hand").style.transform = `rotate(${SecDeg}deg)`;
            document.getElementById("date").textContent = date;
            document.getElementById("week-hand").style.transform = `rotate(${dayDeg}deg)`;
        }

        function init() {
            setDots();
            updateclock();
            setInterval(() => { updateclock() }, 200); // 5振動の挙動
        }

        window.addEventListener('load', () => {
            init(); 
        });

        // -------------------------------------------------------------------------------------------------

        // setting faces dot width
        function dotClipPath(thickness) {
            const start = 50 - thickness;
            const end = 50 + thickness;
            return `${start}% 0%, ${end}% 0%, ${end}% ${start}%,100% ${start}%,100% ${end}%,${end}% ${end}%,
            ${end}% 100%,${start}% 100%,${start}% ${end}%,0% ${end}%,0% ${start}%,${start}% ${start}%`;
        }
        function setDotsThickness() {
            const style = document.createElement('style');
            style.textContent = `
            /* main dial dots */
            .hour-dots{ clip-path: polygon(${dotClipPath(0.5)}); }
            .hour-hands-dots{ clip-path: polygon(${dotClipPath(0.2)}); }
            .min-dots{ clip-path: polygon(${dotClipPath(0.15)}); }

            /* for small second */
            .sec-3x-hour-dots{ clip-path: polygon(${dotClipPath(1)}); }
            .sec-hour-dots{ clip-path: polygon(${dotClipPath(0.8)}); }
            .sec-min-dots{ clip-path: polygon(${dotClipPath(0.3)}); }
            `;

            document.head.appendChild(style);
        }

        setDotsThickness()
        
        // Alerm script=============================================================================
        function prepareAudio() {
           let  audio = new Audio('./sound/alarm.mp3'); // select
        }

        let alarmInterval = null;

        document
            .getElementById("AlarmButton")
            .addEventListener("click", () => {
            
                prepareAudio();
            
                // 既存タイマーを停止
                if (alarmInterval !== null) {
                    clearInterval(alarmInterval);
                }
            
                const now = new Date();
            
                // 次の5分区切り
                const baseTime = new Date(now);
                baseTime.setSeconds(0, 0);
                baseTime.setMinutes(Math.ceil(now.getMinutes() / 5) * 5);
            
                // アラーム
                const alarmTime = new Date(baseTime);
                alarmTime.setMinutes(alarmTime.getMinutes() + 30);
            
                const alarmTime2 = new Date(baseTime);
                alarmTime2.setMinutes(alarmTime2.getMinutes() + 40);
            
                alert(
                    `アラームが設定されました！ ` +
                    `${formatTime(alarmTime)}, ${formatTime(alarmTime2)}`
                );
            
                degree_circle_();
            
                let alarm1Played = false;
            
                alarmInterval = setInterval(() => {
                
                    const current = new Date();
                
                    if (!alarm1Played && current >= alarmTime) {
                        playAlarm();
                        alarm1Played = true;
                    }
                
                    if (current >= alarmTime2) {
                    
                        document.documentElement.style.setProperty(
                            "--pre_deg1", "0%"
                        );
                        document.documentElement.style.setProperty(
                            "--pre_deg2", "0%"
                        );
                        document.documentElement.style.setProperty(
                            "--pre_deg3", "0%"
                        );
                    
                        playAlarm();
                    
                        clearInterval(alarmInterval);
                        alarmInterval = null;
                    }
                
                }, 1000);
            });
        
        
        function formatTime(date) {
            return date.toLocaleTimeString("ja-JP", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });
        }

        function degree_circle_() {
        const now = new Date();
        let sec_deg = now.getSeconds();
        let min_deg = now.getMinutes();
        let base_time;
            
        if (min_deg % 5 === 0) {
            base_time = min_deg;
        } else {
            base_time = Math.ceil(min_deg / 5) * 5; // 最小の5の倍数に切り上げ
        }
        // base_time = Fill uped now time

        // 次の5分区切りの5分前を、円の15分位置として扱う
        const referenceMinute = base_time - 5;
        const UI_REFERENCE_MINUTE = 15;
            
        const d_min =
            min_deg - referenceMinute + UI_REFERENCE_MINUTE;// あわせ
        
        const MINUTE_PERCENT = 100 / 60;
        const SECOND_PERCENT = 100 / 3600;
        
        // hourを跨ぐと動かないっぽい(100%超過は不可)
        // Fixed: pre_deg3を100%とし，他の部分の角度を算出，全体を回転させる

        const pre_deg1 =
            Math.round(
                (d_min * MINUTE_PERCENT + sec_deg * SECOND_PERCENT) * 10
            ) / 10 + "%";

        const pre_deg2 = "83.33333%"; // 50min
        const pre_deg3 = "100%" ;     // 60min

        const pre_degree = Math.round(((base_time + 40) *6)*10)/10; // 角度


        document.getElementById("alarm-disk").style.transform = `translate(-50%,-50%) rotate(${pre_degree}deg)`;

        document.documentElement.style.setProperty("--pre_deg1", pre_deg1);
        document.documentElement.style.setProperty("--pre_deg2", pre_deg2);
        document.documentElement.style.setProperty("--pre_deg3", pre_deg3);
